# Test gate (#46). Runs the repo's checks on every PR and on push to main.
# A push to main deploys to GitHub Pages immediately, so the stamp job there is an
# alert, not a gate; make the `tests` check required in branch protection to gate merges.
name: tests
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node tests/validate-data.js
      - run: node tests/feedback-prefill.mjs
      - run: node tests/controls-overflow.mjs
      - run: node tests/autocomplete-keyboard.mjs
      - run: node tests/category-registry.mjs
      - run: node tests/css-tokens.mjs
      - run: node tests/sw-assets.mjs
      - run: node tests/font-scale-storage.mjs
      - run: python tools/check-doc-links.py

  stamp:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check-stamp.py
